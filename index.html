*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.47059;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color 0.3s,color 0.3s}
.app{min-height:100vh;position:relative}
.sidebar{width:280px;background:var(--white);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.logo{padding:0 20px 20px;border-bottom:0.5px solid var(--border);margin-bottom:16px}
.logo-text{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.5px;margin-bottom:4px}
.logo-subtitle{font-size:24px;font-weight:700;color:var(--text);font-family:'DM Sans',sans-serif}
.sync-status{padding:0 24px 16px;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sync-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sync-connected{background:var(--green)}
.sync-connecting{background:var(--orange);animation:pulse 1.5s infinite}
.sync-error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-text{flex:1;font-size:11px;color:var(--text-light)}
.reload-btn{padding:4px 8px;font-size:10px;background:var(--blue);color:white;border:none;border-radius:4px;cursor:pointer}
.reload-btn:hover{background:var(--blue-dark)}
.mode-indicator{padding:0 24px 8px;font-size:11px;display:flex;align-items:center;gap:6px}
.mode-badge{padding:4px 8px;border-radius:4px;font-weight:600;font-size:10px}
.mode-badge.viewer{background:var(--blue-light);color:var(--blue)}
.mode-badge.admin{background:var(--green-bg);color:var(--green)}
.dark-toggle{margin-left:auto;padding:4px 8px;background:var(--gray-bg);border:1px solid var(--border);borderRadius:6px;cursor:pointer;fontSize:16px;transition:all 0.2s}
.dark-toggle:hover{background:var(--border)}
.save-status{padding:0 24px 8px;font-size:11px;color:var(--text-light);display:flex;align-items:center;gap:6px}
.save-status-dot{width:6px;height:6px;border-radius:50%;background:var(--gray)}
.save-status-dot.saving{background:var(--orange);animation:pulse 1s infinite}
.save-status-dot.success{background:var(--green)}
.save-status-dot.error{background:var(--red)}
.nav-item{padding:10px 16px;margin:0 12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;border-radius:10px;border-left:none}

.nav-item.active{background:var(--ios-blue-light);color:var(--ios-blue);border-left:none;font-weight:600}
.nav-icon{font-size:18px}
.nav-text{flex:1;font-size:14px;font-weight:500}
.nav-count{font-size:12px;color:var(--text-light);background:var(--gray-bg);padding:2px 8px;border-radius:12px}
.main{flex:1;padding:48px 64px;max-width:1800px;margin-left:280px}
.header{margin-bottom:32px}
.title{font-size:36px;font-weight:700;color:var(--text);margin-bottom:8px;font-family:'DM Sans',sans-serif}
.subtitle{font-size:16px;color:var(--text-light)}
.status-overview{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px}
.dashboard-stats{margin-bottom:24px}

.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px;transition:border-color .15s}
.stat-card:hover{border-color:var(--ios-gray-3)}

.stat-icon{font-size:18px;margin-bottom:6px}

.notification-badge{position:absolute;top:4px;right:4px;background:var(--red);color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite}

.notification-dropdown{position:absolute;top:100%;left:12px;right:12px;width:auto;background:var(--white);border:none;border-radius:12px;box-shadow:var(--shadow-lg);max-height:400px;overflow-y:auto;z-index:1000;margin-top:8px}
.notification-header{padding:16px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.notification-item{padding:16px;border-bottom:1px solid var(--border);transition:background 0.2s;cursor:pointer}
.notification-item:last-child{border-bottom:none}
.notification-item:hover{background:var(--gray-bg)}
.notification-item-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notification-icon{font-size:18px}

.notification-empty{padding:40px 20px;text-align:center;color:var(--text-light);font-size:14px}
.status-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:all .2s;cursor:pointer}

.status-card.active{border-width:2px;box-shadow:var(--shadow)}
.status-icon{font-size:32px;margin-bottom:8px}
.status-count{font-size:28px;font-weight:700;font-family:'DM Sans',sans-serif;margin-bottom:4px}
.status-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

.status-card.kritiek .status-count{color:var(--red)}
.status-card.aandacht .status-count{color:var(--orange)}
.status-card.schema .status-count{color:var(--yellow)}
.status-card.top .status-count{color:var(--green)}
.filter-bar{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.filter-label{font-size:13px;font-weight:600;color:var(--text-light)}
.filter-btn{padding:6px 12px;border:1px solid var(--border);background:var(--white);border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.filter-btn:hover{background:var(--bg)}
.filter-btn.active{background:var(--blue);color:white;border-color:var(--blue)}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:32px;margin-bottom:48px}
.client-card{background:var(--white);border:none;border-radius:16px;padding:20px;transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);position:relative;cursor:pointer;box-shadow:var(--shadow-card)}
.client-card:hover{box-shadow:0 8px 16px rgba(0,0,0,0.12),0 2px 6px rgba(0,0,0,0.08);transform:translateY(-2px)}

.client-card:hover .edit-client-btn{opacity:1}
.edit-client-btn:hover{background:var(--blue-dark);transform:scale(1.05)}
.client-status-badge{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow)}
.client-status-badge.opstartfase{background:var(--lightblue-bg)}
.client-status-badge.kritiek{background:var(--red-bg)}
.client-status-badge.aandacht{background:var(--orange-bg)}
.client-status-badge.schema{background:var(--yellow-bg)}
.client-status-badge.top{background:var(--green-bg)}
.client-header{margin-bottom:16px;padding-bottom:0;border-bottom:none}
.client-name{font-size:20px;font-weight:700;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;letter-spacing:-0.02em;line-height:1.2}
.client-meta{font-size:13px;color:var(--text-light);margin-bottom:12px;margin-top:6px;font-weight:500}
.client-link{color:var(--ios-blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:12px;font-weight:500}
.client-link:hover{text-decoration:underline;opacity:0.8}
.delete-btn{background:var(--red-bg);color:var(--red);border:none;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.delete-btn:hover{background:var(--red);color:var(--white)}
.client-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0;padding:0}

.stat-number{font-size:32px;font-weight:700;color:var(--ios-blue);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;line-height:1;margin-bottom:4px;letter-spacing:-0.02em}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-light);font-weight:600}
.progress-section{margin-top:16px;padding-top:0}

.progress-percentage{font-weight:600;color:#1E3A5F;font-size:15px}

.planning-box{margin-top:16px;padding:16px;background:#F4F7FA;border-radius:12px;border:none}
.planning-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#1E3A5F;margin-bottom:10px}
.planning-item{font-size:13px;color:var(--text);margin-bottom:4px;line-height:1.5;font-weight:500}
.pm-overview{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.pm-label{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.pm-filter-btn{padding:8px 16px;border:1px solid var(--border);background:var(--white);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;font-weight:500}
.pm-filter-btn:hover{background:var(--bg);transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.05)}
.pm-filter-btn.active{border-width:2px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pm-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:500;color:white;margin-top:6px;opacity:0.7}
.sort-section{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.sort-label{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.sort-dropdown{padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--white);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .2s;outline:none;min-width:240px}
.sort-dropdown:hover{border-color:var(--blue);background:var(--bg)}
.sort-dropdown:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,144,226,.1)}
.add-client-card{background:var(--blue-light);border:2px dashed var(--blue);border-radius:12px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.add-client-card:hover{background:var(--blue);border-color:var(--blue-dark)}
.add-client-card:hover .add-icon,.add-client-card:hover .add-text{color:var(--white)}
.add-icon{font-size:48px;color:var(--blue);margin-bottom:12px;transition:all .2s}
.add-text{font-size:16px;font-weight:600;color:var(--blue);transition:all .2s}
.time-entries-section{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}

.time-entries-toggle:hover{background:var(--border)}
.time-entries-toggle-text{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.5px}
.time-entries-toggle-icon{font-size:14px;color:var(--text-light);transition:transform 0.2s}
.time-entries-toggle-icon.expanded{transform:rotate(180deg)}
.time-entries-list{margin-top:8px}
.time-entry{display:flex;align-items:flex-start;justify-content:space-between;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:12px;border:1px solid var(--border)}
.time-entry.negative{background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.2)}
.time-entry.positive{background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2)}
.time-entry-content{flex:1}
.time-entry-hours{font-weight:700;margin-bottom:2px}
.time-entry-hours.negative{color:var(--red)}
.time-entry-hours.positive{color:var(--green)}
.time-entry-desc{color:var(--text-light);line-height:1.4}
.time-entry-date{font-size:10px;color:var(--text-light);margin-top:2px}
.time-entry-delete{padding:4px 8px;background:#94a3b8;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;transition:all 0.2s}
.time-entry-delete:hover{background:#64748b}
.section{margin-bottom:32px}
.section-header{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--blue-light)}
.add-item-btn{background:var(--blue);color:var(--white);border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.add-item-btn:hover{background:var(--blue-dark)}

.banner-text{font-size:14px;color:var(--blue-dark)}
.banner-client{font-weight:700;color:var(--blue)}
.banner-status-display{display:flex;align-items:center;gap:8px;padding:8px 16px;background:white;border-radius:6px;font-size:13px;font-weight:600}
.banner-status-icon{font-size:20px}
.banner-buttons{display:flex;gap:8px;flex-wrap:wrap}
.banner-btn{background:#4A7BA7;color:white;border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.banner-btn:hover{background:#3D6A91}
.banner-btn.danger{background:var(--red)}
.banner-btn.danger:hover{background:#B91C1C}

.task-card.clickable:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.task-card.completed{background:var(--bg);opacity:.7}

.checkbox.clickable{cursor:pointer}
.checkbox.clickable:hover{border-color:#3B82F6;background:#EFF6FF}
.checkbox.checked{background:#3B82F6;border-color:#3B82F6}
.task-content{flex:1}
.task-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:4px}
.task-desc{font-size:13px;color:var(--text-light)}
.task-card.completed .task-title{text-decoration:line-through;color:var(--text-light)}

// FILTER TAKEN OP BASIS VAN KLANT TYPE
const filterTasksForClient=(tasks,client)=>{
if(!tasks||!client)return tasks||[];
return tasks.filter(task=>{
if(!task.show)return true;
if(task.show==='hotel')return client.clientType==='hotel';
if(task.show==='restaurant')return client.clientType==='restaurant'||client.clientType==='strandtent'||client.clientType==='hotel_restaurant';
if(task.show==='multi')return client.multiLocation;
if(task.show==='multilingual')return client.isMultilingual;
return true;
});
};

const filterSectionsForClient=(sections,client)=>{
if(!sections||!client)return sections||[];
return sections.map(section=>({
...section,
tasks:filterTasksForClient(section.tasks,client)
})).filter(section=>section.tasks.length>0);
};

function Toast({message,type,onClose}){
useEffect(()=>{
const timer=setTimeout(()=>{
const el=document.querySelector('.toast');

},3000);
return()=>clearTimeout(timer);
},[onClose]);
const icons={success:'✅',error:'❌',info:'💾'};
return(<div className={`toast toast-${type}`}><div className="toast-icon">{icons[type]}</div><div className="toast-text">{message}</div></div>);
}

// Confetti - cirkel rond het midden
for(let i=0;i<15;i++){
const angle=(i/15)*Math.PI*2;
const distance=80+Math.random()*60;
newParticles.push({
id:`confetti-${i}`,
type:'confetti',
shape:['circle','square','star'][Math.floor(Math.random()*3)],
color:colors[Math.floor(Math.random()*colors.length)],
x:150+Math.cos(angle)*distance,
y:150+Math.sin(angle)*distance,
delay:Math.random()*0.3,
size:Math.random()*8+6
});
}

// Fireworks - ring rond het midden
for(let i=0;i<5;i++){
const angle=(i/5)*Math.PI*2;
const distance=60+Math.random()*40;
newParticles.push({
id:`firework-${i}`,
type:'firework',
color:colors[Math.floor(Math.random()*colors.length)],
x:150+Math.cos(angle)*distance,
y:150+Math.sin(angle)*distance,
delay:0.1+Math.random()*0.4
});
}

// Sparkles/Emojis - dichter bij het midden
for(let i=0;i<3;i++){
const angle=(i/3)*Math.PI*2;
const distance=40+Math.random()*50;
newParticles.push({
id:`sparkle-${i}`,
type:'sparkle',
emoji:emojis[Math.floor(Math.random()*emojis.length)],
x:150+Math.cos(angle)*distance,
y:150+Math.sin(angle)*distance,
delay:Math.random()*0.2
});
}

setParticles(newParticles);
},[]);

return(
<div className="celebration-overlay">
<div className="celebration-center">
<div className="celebration-text">✓</div>
{particles.map(p=>{
if(p.type==='confetti'){
return <div key={p.id} className={`confetti ${p.shape}`} style={{left:`${p.x}px`,top:`${p.y}px`,backgroundColor:p.color,animationDelay:`${p.delay}s`,width:`${p.size}px`,height:`${p.size}px`}}/>;
}
if(p.type==='firework'){
return <div key={p.id} className="firework" style={{left:`${p.x}px`,top:`${p.y}px`,backgroundColor:p.color,animationDelay:`${p.delay}s`,boxShadow:`0 0 10px ${p.color}, 0 0 20px ${p.color}`}}/>;
}
if(p.type==='sparkle'){
return <div key={p.id} className="sparkle" style={{left:`${p.x}px`,top:`${p.y}px`,animationDelay:`${p.delay}s`}}>{p.emoji}</div>;
}
return null;
})}
</div>
</div>
);
}

const monthItems=planningItems[`${selectedClient}-${month.key}`]||[];
return(

</div>
{monthItems.map(item=>{
const itemKey=`${selectedClient}-planning-${month.key}-${item.id}`;
const itemDeadline=deadlines[itemKey];
const getUrgency=(dateStr)=>{
if(!dateStr)return{color:'gray',label:'',urgent:false};
const deadline=new Date(dateStr);
const now=new Date();
now.setHours(0,0,0,0);
deadline.setHours(0,0,0,0);
const diffDays=Math.ceil((deadline-now)/(1000*60*60*24));
if(diffDays<0)return{color:'red',label:'Verlopen',urgent:true};
if(diffDays===0)return{color:'red',label:'Vandaag',urgent:true};
if(diffDays===1)return{color:'red',label:'Morgen',urgent:true};
if(diffDays<=7)return{color:'orange',label:`Over ${diffDays} dgn`,urgent:false};
return{color:'green',label:`Over ${diffDays} dgn`,urgent:false};
};
const urgency=getUrgency(itemDeadline);
return(
<div key={item.id} className={`task-card ${item.completed?'completed':''} ${isAdmin?'clickable':''}`} style={{position:'relative'}}>
{editingItem===item.id?(
<div style={{display:'flex',gap:'8px',width:'100%'}}>
<input type="text" className="modal-input" value={editValue} onChange={(e)=>setEditValue(e.target.value)} onKeyPress={(e)=>{if(e.key==='Enter'){onUpdate(month.key,item.id,editValue);setEditingItem(null);setEditValue('');}}} autoFocus style={{margin:0,flex:1}}/>

<button className="btn btn-secondary" onClick={()=>{setEditingItem(null);setEditValue('');}} style={{padding:'10px 20px'}}>Annuleren</button>
</div>
):(
<>
<div onClick={()=>{if(isAdmin)onToggle(month.key,item.id);}} style={{display:'flex',alignItems:'center',gap:'16px',flex:1}}>
<div className={`checkbox ${item.completed?'checked':''} ${isAdmin?'clickable':''}`}>{item.completed&&<span style={{color:'white',fontSize:'14px',fontWeight:'bold'}}>✓</span>}</div>
<div className="task-content" style={{flex:1}}>
<div className="task-title">{item.text}</div>
{itemDeadline&&(
<div style={{fontSize:'12px',marginTop:'4px',color:urgency.color==='red'?'#d73a49':urgency.color==='orange'?'#f59e0b':'#10b981',fontWeight:'500'}}>

</>
)}
</div>
);
})}

function ActieoverzichtView({clients,tasks,customItems,planningItems,getClientHours,isAdmin,setSelectedClient,setActiveView}){
const now=new Date();
const nowKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const prevDate=new Date(now.getFullYear(),now.getMonth()-1,1);
const prevKey=prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0');
const monthNames={1:'Januari',2:'Februari',3:'Maart',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Augustus',9:'September',10:'Oktober',11:'November',12:'December'};

const getCat=(title)=>{
const t=(title||'').toLowerCase();
if(t.includes('gmb')||t.includes('google my business')||t.includes('reviews')||t.includes('profiel')||t.includes('foto'))return{label:'GMB',bg:'#fdf4ff',color:'#7e22ce'};
if(t.includes('link')||t.includes('backlink')||t.includes('gastblog')||t.includes('directory')||t.includes('tripadvisor'))return{label:'Linkbuilding',bg:'#fff7ed',color:'#c2410c'};
if(t.includes('content')||t.includes('tekst')||t.includes('blog')||t.includes('menu')||t.includes('pagina'))return{label:'Content',bg:'#f0fdf4',color:'#15803d'};
if(t.includes('rapport')||t.includes('analytics')||t.includes('meten')||t.includes('ranking'))return{label:'Rapportage',bg:'#f8fafc',color:'#475569'};
if(t.includes('pagespeed')||t.includes('schema')||t.includes('sitemap')||t.includes('robots')||t.includes('ssl')||t.includes('redirect')||t.includes('core web'))return{label:'Technisch',bg:'#eff6ff',color:'#1d4ed8'};
return{label:'On-page SEO',bg:'#eff6ff',color:'#1d4ed8'};
};

const statusColor={top:'#10b981',schema:'#3b82f6',aandacht:'#f59e0b',kritiek:'#ef4444',opstartfase:'#94a3b8'};
const statusLabel={top:'Top',schema:'Op schema',aandacht:'Aandacht',kritiek:'Kritiek',opstartfase:'Opstartfase'};

const activeClients=[...clients.filter(c=>!c.archived)].sort((a,b)=>{
const score={kritiek:4,aandacht:3,schema:2,top:1,opstartfase:0};
const sa=score[a.status]||0,sb=score[b.status]||0;
const ha=getClientHours(a.id),hb=getClientHours(b.id);
const pa=a.budget>0?Math.round((ha/a.budget)*100):0;
const pb=b.budget>0?Math.round((hb/b.budget)*100):0;
return(sb+Math.floor(pb/20))-(sa+Math.floor(pa/20));
}).reverse();

return(
<div style={{maxWidth:'960px',paddingBottom:'40px'}}>
{activeClients.map(client=>{
const hours=getClientHours(client.id);
const budget=client.budget||0;
const pct=budget>0?Math.round((hours/budget)*100):0;
const isUrgent=pct>=80||client.status==='kritiek';
const isAtt=client.status==='aandacht'||pct>=60;
const borderColor=isUrgent?'#ef4444':isAtt?'#f59e0b':statusColor[client.status]||'#94a3b8';

// Open planning items this month
const cp=planningItems[client.id]||{};
const prevItems=((cp[prevKey]||{}).items||[]).filter(i=>!i.completed).map(i=>({text:i.text,carried:true,cat:getCat(i.text)}));
const thisItems=((cp[nowKey]||{}).items||[]).filter(i=>!i.completed).map(i=>({text:i.text,cat:getCat(i.text)}));
const allTaken=[...prevItems,...thisItems].slice(0,5);

const initials=(client.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const avBg=isUrgent?'#fef2f2':isAtt?'#fffbeb':client.status==='top'?'#f0fdf4':'var(--ios-gray-6)';
const avCol=isUrgent?'#ef4444':isAtt?'#b45309':client.status==='top'?'#15803d':'var(--text-light)';

return(
<div key={client.id} style={{background:'var(--white)',border:'0.5px solid var(--border)',borderLeft:'3px solid '+borderColor,borderRadius:'12px',overflow:'hidden',marginBottom:'10px',cursor:'pointer'}} onClick={()=>{setSelectedClient(client.id);setActiveView('roadmap');}}>
<div style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:'10px',borderBottom:'0.5px solid var(--border)'}}>
<div style={{width:'32px',height:'32px',borderRadius:'8px',background:avBg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'600',color:avCol,flexShrink:0}}>{initials}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:'14px',fontWeight:'600',color:'var(--text)'}}>{client.name}</div>
<div style={{fontSize:'11px',color:'var(--text-light)',marginTop:'2px',display:'flex',gap:'10px',flexWrap:'wrap'}}>
{client.website&&<span>{client.website.replace(/https?:\/\//,'')}</span>}
{budget>0&&<span style={{color:pct>=80?'#ef4444':'inherit',fontWeight:pct>=80?'600':'400'}}>{hours}/{budget}u{pct>=80?' ⚠':''}</span>}
</div>
</div>
<span style={{background:statusColor[client.status]||'#94a3b8',color:'white',padding:'3px 10px',borderRadius:'20px',fontSize:'10px',fontWeight:'600',flexShrink:0}}>{statusLabel[client.status]||client.status}</span>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0'}}>
<div style={{padding:'12px 14px',borderRight:'0.5px solid var(--border)'}}>
<div style={{fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px',color:isUrgent?'#ef4444':isAtt?'#f59e0b':'var(--text-light)',marginBottom:'8px'}}>Nu doen</div>
{allTaken.length===0?(
<div style={{fontSize:'12px',color:'var(--text-lighter)',fontStyle:'italic'}}>Geen taken ingepland</div>
):(
<div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
{allTaken.map((t,i)=>(
<div key={i} style={{display:'flex',alignItems:'flex-start',gap:'6px',fontSize:'12px'}}>
<span style={{width:'14px',height:'14px',borderRadius:'3px',background:t.carried?'#fffbeb':'var(--ios-gray-6)',border:'1px solid '+(t.carried?'#fcd34d':'var(--border)'),flexShrink:0,marginTop:'1px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',color:t.carried?'#b45309':'transparent'}}>{t.carried?'↻':''}</span>
<span style={{lineHeight:'1.4',flex:1}}>{t.text}{t.carried&&<span style={{fontSize:'10px',background:'#fffbeb',color:'#b45309',padding:'1px 5px',borderRadius:'3px',marginLeft:'4px'}}>doorgeschoven</span>}</span>
</div>
))}
</div>
)}
</div>
<div style={{padding:'12px 14px',borderRight:'0.5px solid var(--border)'}}>
<div style={{fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px',color:'var(--text-light)',marginBottom:'8px'}}>Categorie</div>
<div style={{display:'flex',flexDirection:'column',gap:'5px'}}>
{allTaken.map((t,i)=>(
<span key={i} style={{display:'inline-flex',padding:'3px 9px',borderRadius:'5px',fontSize:'11px',fontWeight:'500',background:t.cat.bg,color:t.cat.color,alignSelf:'flex-start'}}>{t.cat.label}</span>
))}
</div>
</div>
<div style={{padding:'12px 14px'}}>
<div style={{fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px',color:'var(--text-light)',marginBottom:'8px'}}>Budget</div>
{budget>0?(
<div>
<div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',marginBottom:'5px'}}>
<span style={{color:'var(--text-light)'}}>Verbruikt</span>
<span style={{fontWeight:'600',color:pct>=80?'#ef4444':'var(--text)'}}>{pct}%</span>
</div>
<div style={{height:'5px',background:'var(--ios-gray-5)',borderRadius:'3px',marginBottom:'6px'}}>
<div style={{width:Math.min(100,pct)+'%',height:'5px',borderRadius:'3px',background:pct>=80?'#ef4444':pct>=60?'#f59e0b':'#10b981'}}/>
</div>
<div style={{fontSize:'11px',color:'var(--text-light)'}}>{hours}u gebruikt · {Math.max(0,Math.round((budget-hours)*10)/10)}u resterend</div>
</div>
):(
<div style={{fontSize:'12px',color:'var(--text-lighter)',fontStyle:'italic'}}>Geen pakket ingesteld</div>
)}
</div>
</div>
</div>
);
})}
</div>
);
}

// DEADLINE FUNCTIONS
const setDeadline=(key,date)=>{
if(!isAdmin)return;
console.log('🔄 setDeadline called - key:',key,'date:',date);

// Auto-move planning items to correct month based on deadline
// Key format: clientId-planning-monthKey-itemId
if(key.includes('-planning-')&&date){
console.log('📅 Planning item detected, attempting to move...');
const parts=key.split('-planning-');
if(parts.length===2){
const clientId=parts[0];
const remaining=parts[1]; // e.g. "2025-12-456789" or "2025-12-1234567890123"
console.log('🔍 Parsing - clientId:',clientId,'remaining:',remaining);

// Split remaining on '-' and take first 2 parts as month, rest as itemId
const remainingParts=remaining.split('-');
if(remainingParts.length>=3){
const oldMonthKey=`${remainingParts[0]}-${remainingParts[1]}`; // "2025-12"
const itemId=remainingParts.slice(2).join('-'); // Join rest in case itemId has dashes
console.log('🔍 Parsed - oldMonthKey:',oldMonthKey,'itemId:',itemId);

// Parse deadline to get new month key
const deadlineDate=new Date(date);
const year=deadlineDate.getFullYear();
const month=(deadlineDate.getMonth()+1).toString().padStart(2,'0');
const newMonthKey=`${year}-${month}`;
console.log('📆 Old month:',oldMonthKey,'New month:',newMonthKey);

// If month changed, move the item
if(oldMonthKey!==newMonthKey){
console.log('🚚 Month changed! Moving item...');
const oldKey=`${clientId}-${oldMonthKey}`;
const newKey=`${clientId}-${newMonthKey}`;
const oldItems=planningItems[oldKey]||[];
const newItems=planningItems[newKey]||[];
console.log('📦 Old items:',oldItems.length,'New items:',newItems.length);

// Find item - try both string and number comparison
const itemToMove=oldItems.find(item=>{
// Compare as both string and number
return String(item.id)===String(itemId)||item.id===Number(itemId)||item.id===itemId;
});

console.log('🔍 Item to move:',itemToMove);

if(itemToMove){
console.log('✅ Item found! Moving...');
const updatedOldItems=oldItems.filter(item=>String(item.id)!==String(itemId));
const updatedNewItems=[...newItems,itemToMove];

const updatedPlanningItems={
...planningItems,
[oldKey]:updatedOldItems,
[newKey]:updatedNewItems
};

setPlanningItems(updatedPlanningItems);

// Update deadline key to new month
const newDeadlineKey=`${clientId}-planning-${newMonthKey}-${itemId}`;
const finalDeadlines={...deadlines,[newDeadlineKey]:date};
delete finalDeadlines[key];
setDeadlines(finalDeadlines);

saveData({tasks,customItems,planningItems:updatedPlanningItems,notes,deadlines:finalDeadlines,clients,timeTracking});
setShowDeadlineModal(false);
setToast({type:'success',message:`✓ Verplaatst naar ${getMonthLabel(newMonthKey)}`});
console.log('✅ Move complete!');
return;
}else{
console.error('❌ Item not found in old month!');
console.log('❌ Looking for itemId:',itemId,'(type:',typeof itemId,')');
console.log('❌ Available IDs:',oldItems.map(i=>({id:i.id,type:typeof i.id})));
}
}else{
console.log('ℹ️ Same month, no move needed');
}
}else{
console.error('❌ Invalid remaining parts:',remainingParts);
}
}
}

const newDeadlines={...deadlines,[key]:date};
setDeadlines(newDeadlines);
saveData({tasks,customItems,planningItems,notes,deadlines:newDeadlines,clients,timeTracking});
setShowDeadlineModal(false);
setToast({type:'success',message:'✓ Deadline ingesteld'});

};

const getMonthLabel=(monthKey)=>{
const monthNames=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const [year,month]=monthKey.split('-');
return`${monthNames[parseInt(month)-1]} ${year}`;
};

const getLastWorkdayOfMonth=(monthKey)=>{
const [year,month]=monthKey.split('-');
const y=parseInt(year);
const m=parseInt(month);
// Get last day of month
const lastDay=new Date(y,m,0);
const lastDate=lastDay.getDate();
// Find last workday (Mon=1, Tue=2, Wed=3, Thu=4)
// Not Friday(5), Saturday(6), Sunday(0)
for(let day=lastDate;day>=1;day--){
const date=new Date(y,m-1,day);
const dayOfWeek=date.getDay();
// Check if it's a workday (Monday through Thursday)
if(dayOfWeek>=1&&dayOfWeek<=4){
return date.toISOString().split('T')[0];
}
}
// Fallback to last day if somehow no workday found (shouldn't happen)
return new Date(y,m-1,lastDate).toISOString().split('T')[0];
};

const getDeadlineUrgency=(dateStr)=>{
if(!dateStr)return{color:'gray',label:'Geen deadline',urgent:false};
const deadline=new Date(dateStr);
const now=new Date();
now.setHours(0,0,0,0);
deadline.setHours(0,0,0,0);
const diffDays=Math.ceil((deadline-now)/(1000*60*60*24));
if(diffDays<0)return{color:'red',label:'Verlopen',urgent:true};
if(diffDays===0)return{color:'red',label:'Vandaag!',urgent:true};
if(diffDays===1)return{color:'red',label:'Morgen',urgent:true};
if(diffDays<=7)return{color:'orange',label:`Over ${diffDays} dagen`,urgent:false};
return{color:'green',label:`Over ${diffDays} dagen`,urgent:false};
};

const getAllUpcomingDeadlines=()=>{
const upcoming=[];
Object.keys(deadlines).forEach(key=>{
// Only include planning items (keys with "planning" in them)
if(!key.includes('planning'))return;
const urgency=getDeadlineUrgency(deadlines[key]);
if(urgency.urgent){
const parts=key.split('-');
const clientId=parts[0];
const monthKey=parts[2];
const itemId=parts[3];
const client=clients.find(c=>c.id===clientId);
if(client){
// Find the planning item text
const monthItems=planningItems[`${clientId}-${monthKey}`]||[];
const item=monthItems.find(i=>i.id===itemId);
const itemText=item?item.text:'Planning item';
upcoming.push({key,date:deadlines[key],urgency,clientName:client.name,itemText});
}
}
});
return upcoming.sort((a,b)=>new Date(a.date)-new Date(b.date));
};

// NOTIFICATIONS SYSTEM
const getNotifications=()=>{
const now=new Date();
const notifications=[];
const currentYear=now.getFullYear();
const currentMonth=(now.getMonth()+1).toString().padStart(2,'0');
const currentMonthKey=`${currentYear}-${currentMonth}`;

clients.filter(c=>!c.archived).forEach(client=>{
// Budget warnings (>80%)
if(client.budget>0){
const hours=getClientHours(client.id);
const percentage=(hours/client.budget)*100;
if(percentage>=90){
const id=`budget-critical-${client.id}`;
if(!dismissedNotifications.includes(id)){
notifications.push({
id,
type:'budget-critical',
icon:'🔴',
title:'Pakket kritiek!',
message:`${client.name}: ${Math.round(percentage)}% verbruikt (${hours}u / ${client.budget}u)`,
clientId:client.id,
priority:1
});
}
}else if(percentage>=80){
const id=`budget-warning-${client.id}`;
if(!dismissedNotifications.includes(id)){
notifications.push({
id,
type:'budget-warning',
icon:'⚠️',
title:'Pakket waarschuwing',
message:`${client.name}: ${Math.round(percentage)}% verbruikt (${hours}u / ${client.budget}u)`,
clientId:client.id,
priority:2
});
}
}
}

// Urgent deadlines (<3 days)
const upcoming=getAllUpcomingDeadlines().filter(item=>item.clientId===client.id);
upcoming.forEach(item=>{
const itemDate=new Date(item.date);
const daysUntil=Math.ceil((itemDate-now)/(1000*60*60*24));
if(daysUntil<=0){
const id=`deadline-overdue-${item.key}`;
if(!dismissedNotifications.includes(id)){
notifications.push({
id,
type:'deadline-overdue',
icon:'🔴',
title:'Deadline gemist!',
message:`${client.name}: "${item.text}"`,
clientId:client.id,
priority:1
});
}
}else if(daysUntil<=3){
const id=`deadline-urgent-${item.key}`;
if(!dismissedNotifications.includes(id)){
notifications.push({
id,
type:'deadline-urgent',
icon:'⚠️',
title:`Deadline over ${daysUntil} dag${daysUntil>1?'en':''}`,
message:`${client.name}: "${item.text}"`,
clientId:client.id,
priority:2
});
}
}
});

// No activity for >14 days
const clientNotes=(notes[client.id]||[]);
if(clientNotes.length>0){
const lastNote=clientNotes[clientNotes.length-1];
const lastActivity=new Date(lastNote.date);
const daysSince=Math.ceil((now-lastActivity)/(1000*60*60*24));
if(daysSince>=14){
const id=`inactive-${client.id}`;
if(!dismissedNotifications.includes(id)){
notifications.push({
id,
type:'inactive',
icon:'💤',
title:'Geen activiteit',
message:`${client.name}: ${daysSince} dagen geen update`,
clientId:client.id,
priority:3
});
}
}
}
});

// Sort by priority
return notifications.sort((a,b)=>a.priority-b.priority);
};

// Sort by date
agenda.sort((a,b)=>{
const parseDate=(d)=>{
if(d.includes('-'))return new Date(d);
const months={Januari:0,Februari:1,Maart:2,April:3,Mei:4,Juni:5,Juli:6,Augustus:7,September:8,Oktober:9,November:10,December:11};
const parts=d.split(' ');
const month=months[parts[0]]||0;
const year=parseInt(parts[1])||new Date().getFullYear();
return new Date(year,month,15);
};
return parseDate(a.date)-parseDate(b.date);
});

// Group by urgency
const now=new Date();
const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const endOfThisMonth=new Date(now.getFullYear(),now.getMonth()+1,0);

const grouped={overdue:[],thisWeek:[],thisMonth:[],later:[]};
agenda.forEach(item=>{
const parseDate=(d)=>{
if(d.includes('-'))return new Date(d);
const months={Januari:0,Februari:1,Maart:2,April:3,Mei:4,Juni:5,Juli:6,Augustus:7,September:8,Oktober:9,November:10,December:11};
const parts=d.split(' ');
const month=months[parts[0]]||0;
const year=parseInt(parts[1])||new Date().getFullYear();
return new Date(year,month,15);
};
const itemDate=parseDate(item.date);
const weekFromNow=new Date(today.getTime()+7*24*60*60*1000);
if(itemDate<today){
grouped.overdue.push(item);
}else if(itemDate<=weekFromNow){
grouped.thisWeek.push(item);
}else if(itemDate<=endOfThisMonth){
grouped.thisMonth.push(item);
}else{
grouped.later.push(item);
}
});

return grouped;
};

const getCurrentMonth=()=>{

// Bereken linkbuilding uren: €50 = 1 uur, afgerond naar boven op 0.25
const calculateLinkbuildingHours=(cost)=>{
const rawHours=(parseFloat(cost)||0)/50;
return Math.ceil(rawHours*4)/4;
};

// Haal linkbuilding uren per klant per maand
const getLinkbuildingHoursForMonth=(clientId,monthKey)=>{
const items=customItems[`${clientId}-5`]||[];
let totalCost=0;
items.forEach(item=>{
if(item.date&&item.date.startsWith(monthKey)&&item.cost){
totalCost+=parseFloat(item.cost)||0;
}
});
return calculateLinkbuildingHours(totalCost);
};

// Haal linkbuilding entries per klant per maand (voor breakdown)
const getLinkbuildingEntriesForMonth=(clientId,monthKey)=>{
const items=customItems[`${clientId}-5`]||[];
const entries=[];
items.forEach(item=>{

entries.push({
id:`lb-${item.id}`,

hours:hours,
stepId:5,

cost:parseFloat(item.cost)||0
});
}
});
return entries;
};

// HELPERS
const getClientProgress=(clientId)=>{
const client=clients.find(c=>c.id===clientId);
let total=0;
let completed=0;
STEPS.forEach(step=>{
if(step.type==='planning'||step.type==='custom'||step.type==='hybrid')return;
if(step.sections){
const filteredSections=filterSectionsForClient(step.sections,client);
filteredSections.forEach(section=>{
section.tasks.forEach(task=>{
total++;
const key=`${clientId}-${step.id}-${task.id}`;
if(tasks[key])completed++;
});
});
}
});
return total>0?Math.round((completed/total)*100):0;
};

const getClientStats=(clientId)=>{
const client=clients.find(c=>c.id===clientId);
let totalTasks=0;
let completedTasks=0;
let customCount=0;
STEPS.forEach(step=>{
if(step.type==='planning')return;
if(step.sections){
const filteredSections=filterSectionsForClient(step.sections,client);
filteredSections.forEach(section=>{
section.tasks.forEach(task=>{
const key=`${clientId}-${step.id}-${task.id}`;
if(irrelevantTasks[key])return;
totalTasks++;
if(tasks[key])completedTasks++;
});
});
}
const customKey=`${clientId}-${step.id}`;
const customList=customItems[customKey]||[];
customCount+=customList.length;
totalTasks+=customList.length;
customList.forEach(item=>{if(item.completed)completedTasks++;});
});
return{total:totalTasks,completed:completedTasks,custom:customCount};
};

const getStepStats=(clientId,stepId)=>{
const step=STEPS.find(s=>s.id===stepId);
const client=clients.find(c=>c.id===clientId);
if(!step||step.type==='planning')return{total:0,completed:0};
let totalTasks=0;
let completedTasks=0;
if(step.sections){
const filteredSections=filterSectionsForClient(step.sections,client);
filteredSections.forEach(section=>{
section.tasks.forEach(task=>{
const key=`${clientId}-${step.id}-${task.id}`;
if(irrelevantTasks[key])return;
totalTasks++;
if(tasks[key])completedTasks++;
});
});
}
const customKey=`${clientId}-${step.id}`;
const customList=customItems[customKey]||[];
totalTasks+=customList.length;
customList.forEach(item=>{if(item.completed)completedTasks++;});
return{total:totalTasks,completed:completedTasks};
};

const getFilteredClients=()=>{

// Filter by archive status

}else{

}
if(statusFilter!=='all'){
filtered=filtered.filter(c=>(c.status||'schema')===statusFilter);
}
if(pmFilter!=='all'){
filtered=filtered.filter(c=>(c.projectManager||'none')===pmFilter);
}
// Sorting
if(sortOrder==='name-asc'){
filtered=[...filtered].sort((a,b)=>a.name.localeCompare(b.name,'nl',{numeric:true,sensitivity:'base'}));
}else if(sortOrder==='name-desc'){
filtered=[...filtered].sort((a,b)=>b.name.localeCompare(a.name,'nl',{numeric:true,sensitivity:'base'}));
}else if(sortOrder==='progress-asc'){
filtered=[...filtered].sort((a,b)=>getClientProgress(a.id)-getClientProgress(b.id));
}else if(sortOrder==='progress-desc'){
filtered=[...filtered].sort((a,b)=>getClientProgress(b.id)-getClientProgress(a.id));
}else if(sortOrder==='hours-asc'){
filtered=[...filtered].sort((a,b)=>getClientHours(a.id)-getClientHours(b.id));
}else if(sortOrder==='hours-desc'){
filtered=[...filtered].sort((a,b)=>getClientHours(b.id)-getClientHours(a.id));
}else if(sortOrder==='budget-asc'){
filtered=[...filtered].sort((a,b)=>(a.budget||0)-(b.budget||0));
}else if(sortOrder==='budget-desc'){
filtered=[...filtered].sort((a,b)=>(b.budget||0)-(a.budget||0));
}else if(sortOrder==='remaining-asc'){
filtered=[...filtered].sort((a,b)=>{
const remainingA=(a.budget||0)-getClientHours(a.id);
const remainingB=(b.budget||0)-getClientHours(b.id);
return remainingA-remainingB;
});
}else if(sortOrder==='remaining-desc'){
filtered=[...filtered].sort((a,b)=>{
const remainingA=(a.budget||0)-getClientHours(a.id);
const remainingB=(b.budget||0)-getClientHours(b.id);
return remainingB-remainingA;
});
}else{
// Fallback: always sort alphabetically if no valid sortOrder
filtered=[...filtered].sort((a,b)=>a.name.localeCompare(b.name,'nl',{numeric:true,sensitivity:'base'}));
}
return filtered;
};

{(()=>{

key,
monthKey,
monthLabel:`${monthNames[month]} ${year}`,
clientId:client.id,
clientName:client.name,
clientCity:client.city,
pm:client.pm,
...data
});
}
}
});

<span style={{color:allDone?'#4ade80':'#64748b',fontSize:'14px',background:allDone?'rgba(74,222,128,0.2)':'#334155',padding:'5px 14px',borderRadius:'14px',fontWeight:'600'}}>{groupCompleted}/{group.tasks.length}</span>
</div>
<div style={{display:'flex',flexDirection:'column',gap:'6px',marginLeft:'12px'}}>
{group.tasks.map((task)=>{const isCurrent=currentIndex===task.globalIndex;return(
<div key={task.id} onClick={()=>{if(isAdmin)toggleTask(task.stepId,task.id);}} style={{display:'flex',alignItems:'center',gap:'14px',padding:'12px 14px',background:task.completed?'rgba(74,222,128,0.1)':isCurrent?'rgba(251,191,36,0.15)':'rgba(255,255,255,0.03)',border:`2px solid ${task.completed?'rgba(74,222,128,0.4)':isCurrent?'#fbbf24':'#334155'}`,borderRadius:'12px',cursor:isAdmin?'pointer':'default',transition:'all 0.2s'}}>
<div style={{width:'32px',height:'32px',borderRadius:'50%',background:task.completed?'#4ade80':isCurrent?'#fbbf24':'#475569',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',color:'white',fontWeight:'700',flexShrink:0}}>{task.completed?'✓':task.globalIndex+1}</div>
<div style={{flex:1,minWidth:0}}><div style={{color:task.completed?'#4ade80':isCurrent?'#fbbf24':'#e2e8f0',fontSize:'14px',fontWeight:isCurrent?'600':'500',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{task.title}</div><div style={{color:'#64748b',fontSize:'12px',marginTop:'2px'}}>{task.sectionTitle}</div></div>
{isCurrent&&!task.completed&&<span style={{background:'#fbbf24',color:'#000',padding:'4px 10px',borderRadius:'10px',fontSize:'10px',fontWeight:'700',flexShrink:0}}>NU</span>}
</div>);})}
</div>
</div>);})}
</div>
{!isAdmin&&(<div style={{marginTop:'12px',padding:'14px',background:'rgba(59,130,246,0.1)',borderRadius:'10px',border:'1px solid rgba(59,130,246,0.3)',textAlign:'center',flexShrink:0}}><span style={{color:'#60a5fa',fontSize:'14px'}}>👀 Je bekijkt de voortgang van dit project</span></div>)}
</div>
{/* Rechter paneel - Berg visualisatie */}
<div style={{width:'40%',position:'relative',overflow:'hidden'}}>
<div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:'linear-gradient(180deg, #87CEEB 0%, #B0E0E6 30%, #98D8C8 60%, #52b788 85%, #2d6a4f 100%)'}}/>
<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice" style={{position:'absolute',bottom:0,left:0,width:'100%',height:'100%'}}>
{/* Achterste bergen */}
<polygon points="-40,600 80,280 200,600" fill="#7c8db0"/>
<polygon points="280,600 380,320 480,600" fill="#8e9cc0"/>
{/* Hoofdberg */}
<polygon points="60,600 200,80 340,600" fill="#5a7a9a"/>
<polygon points="200,80 280,200 340,600 200,600" fill="#4a6a8a" opacity="0.6"/>
{/* Sneeuwkap */}
<polygon points="175,130 200,80 225,130" fill="white"/>
<polygon points="165,150 200,80 235,150 220,140 200,160 180,140" fill="white" opacity="0.9"/>
{/* Gras onderaan */}
<ellipse cx="200" cy="580" rx="200" ry="30" fill="#40916c" opacity="0.6"/>
{/* Klimpad - zigzag over de berg */}
<path d="M200,550 L160,500 L220,450 L170,400 L230,350 L180,300 L220,250 L190,200 L210,150 L200,100" fill="none" stroke="#ef4444" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="0"/>
{/* Checkpoints op het pad */}
{[
{x:200,y:550},{x:160,y:500},{x:220,y:450},{x:170,y:400},{x:230,y:350},
{x:180,y:300},{x:220,y:250},{x:190,y:200},{x:210,y:150},{x:200,y:100}
].map((cp,i)=>{
const jt=getAllTasksForJourney(selectedClient);
const cc=jt.filter(t=>t.completed).length;
const tc=jt.length;
const checkpointProgress=(i+1)/10;
const completionProgress=tc>0?cc/tc:0;
const isCompleted=checkpointProgress<=completionProgress;
return <circle key={i} cx={cp.x} cy={cp.y} r={12} fill={isCompleted?'#4ade80':'white'} stroke={isCompleted?'#22c55e':'#ef4444'} strokeWidth="3"/>;
})}
{/* Vlag op de top */}
<g transform="translate(200,65)">
<line x1="0" y1="0" x2="0" y2="35" stroke="#5D4037" strokeWidth="4"/>
<polygon points="0,0 30,10 0,20" fill="#ef4444"/>
</g>
</svg>
{/* Voortgang overlay */}
<div style={{position:'absolute',bottom:'24px',left:'20px',right:'20px'}}>
<div style={{background:'rgba(15,23,42,0.95)',borderRadius:'16px',padding:'20px',textAlign:'center'}}>
<div style={{fontSize:'42px',fontWeight:'700',color:'#4ade80'}}>{getAllTasksForJourney(selectedClient).length>0?Math.round((getAllTasksForJourney(selectedClient).filter(t=>t.completed).length/getAllTasksForJourney(selectedClient).length)*100):0}%</div>
<div style={{color:'#94a3b8',fontSize:'14px',marginTop:'4px'}}>Voortgang naar de top</div>
</div>
</div>
</div>
</div>
)}

{toast&&<Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}
{showCelebration&&<Celebration/>}
</div>
);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
